# Run the test suite on every push to main and on every pull request.
# Runs on both Windows and Linux so platform-specific logic is exercised — this is
# especially useful because the project supports Linux but is developed on Windows.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly run so the heavy `linux-boot` full-server job (workflow_dispatch + schedule only) fires
  # without a human, catching Linux boot regressions the unit tests cannot.
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Linux boot test (tests/linux-boot.test.js) needs a JDK + zip/unzip to exercise the
      # real /proc walk, process metrics and the zip backup round-trip. ubuntu runners have
      # neither zip nor a JDK by default. Windows runs the same suite but the test skips there.
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: 21

      - name: Install zip/unzip (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - run: npm test

  linux-boot:
    # A1b (v3.0.0): boot a REAL Minecraft server end to end on Linux (download a Paper jar, start it
    # headless, wait for `Done (`, stop, assert no leftover process). HEAVY (~1-2 GB RAM, ~1-3 min),
    # so it is NOT in the default push/PR matrix - it runs on manual dispatch + nightly only.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Java 25: MC 26.1+ requires Java 25. This job boots a REAL Paper 26.2
      # server, so it must run on the same major the jar demands.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - run: npm ci

      - name: Boot a real Paper server headless
        run: node scripts/linux-full-boot.js

  e2e:
    # Electron E2E: launches the real app and drives the renderer. On Linux this needs a
    # virtual display (xvfb-run); on Windows the GUI session is available directly.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run E2E (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: Run E2E (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
