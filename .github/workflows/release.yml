name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Builds the installers and creates the DRAFT release (electron-builder's default releaseType).
  # The draft is intentional: review it, then publish manually so a broken build is never live.
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Build and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--no-network-family-autoselection"
        run: |
          success=0
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt: electron-builder --publish always"
            if npx electron-builder --publish always; then
              echo "electron-builder published successfully on attempt $attempt."
              success=1
              echo "::endgroup::"
              break
            else
              echo "Attempt $attempt failed with exit code $?."
              echo "::endgroup::"
              if [ $attempt -lt 3 ]; then
                echo "Waiting 15 seconds before retrying..."
                sleep 15
              fi
            fi
          done

          if [ $success -ne 1 ]; then
            echo "electron-builder publish failed. Checking if artifacts were built for fallback upload..."
            shopt -s nullglob
            files=(dist/ObserverLauncher*.* dist/latest*.yml)
            if [ ${#files[@]} -gt 0 ]; then
              echo "Artifacts found on disk: ${files[*]}"
              echo "Ensuring draft release exists..."
              gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
                gh release create "${GITHUB_REF_NAME}" --draft --title "ObserverLauncher ${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" || true
              echo "Uploading artifacts via gh release upload..."
              gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
              echo "Fallback upload succeeded."
            else
              echo "Error: electron-builder failed and no artifacts were generated in dist/."
              exit 1
            fi
          fi

  # Attach the modpack artifact to the SAME release, AFTER the installers exist. This is a separate
  # job in the SAME workflow on purpose: a second workflow that also published on the tag raced
  # electron-builder and flipped the release to published while losing the installers. One tag -> one
  # workflow -> one release. `gh release upload` only ATTACHES (never creates, never publishes), so the
  # draft stays a draft until you publish it.
  modpack-artifact:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build modpack artifacts
        run: node scripts/modpack-publish.js --out dist

      - name: Attach to the release (no create, no publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz --repo "${GITHUB_REPOSITORY}" --clobber
