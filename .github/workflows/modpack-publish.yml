# Modpack publish (v3.2.0 Phase D3).
#
# WHY: verify (every PR) and the gated boot-smoke prove a pack is consistent and bootable; the last
# roadmap step is SHIPPING it. On a version tag, build every modpack.json in the repo into a .tar.gz
# and attach it to that tag's GitHub Release, next to the electron-builder installers from release.yml.
#
# Kept as a SEPARATE workflow (not a job in release.yml) so a registry hiccup while resolving a modpack
# can never block the app release itself - a failed pack publish is its own red X.
#
# The build script is cross-platform (a hand-rolled tar.gz, no zip/tar CLI dependency) so it also runs
# locally: `node scripts/modpack-publish.js --out dist`.
name: Modpack publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Resolve + build every modpack.json over the network, then archive each into dist/*.tar.gz.
      # Exits non-zero if any pack fails to resolve/build (a bad pack must not publish).
      - name: Build modpack artifacts
        run: node scripts/modpack-publish.js --out dist

      # Attach the tarballs to the release for THIS tag. action-gh-release creates the release if
      # release.yml has not run yet, and ADDS assets when it already exists (both workflows fire on
      # the same tag), so the app installers and the modpack artifacts end up side by side.
      - name: Upload to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
