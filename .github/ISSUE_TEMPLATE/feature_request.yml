name: Feature request
about: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
      description: Describe the need, not just the solution. What are you trying to do that is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. If you already have a specific approach, describe it.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Optional. Any workaround you use today, or another tool that does this.
    validations:
      required: false
